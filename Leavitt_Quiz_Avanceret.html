<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Leavitt Quiz Avanceret</title><style>body{font-family:Arial,sans-serif;background:#f4f6f9;max-width:900px;margin:auto;padding:20px} .card{background:#fff;padding:25px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.12)} h1{text-align:center}.progress{height:22px;background:#ddd;border-radius:20px;overflow:hidden;margin-bottom:20px}.bar{height:100%;width:0;background:#4caf50;transition:.4s}.option{display:block;padding:12px;margin:8px 0;border:1px solid #ccc;border-radius:8px;cursor:pointer}.option:hover{background:#eef6ff} button{padding:10px 18px;margin-top:12px} #feedback{margin-top:15px;font-weight:bold}</style></head><body><h1>Leavitts udvidede model</h1><div class="progress"><div id="bar" class="bar"></div></div><div class="card"><div id="count"></div><h2 id="q"></h2><div id="answers"></div><button id="check">Tjek svar</button><button id="next" style="display:none">Næste</button><div id="feedback"></div><div id="explanation"></div></div><script>const data=[['Ole fra HR skal på kursus. Hvilket delelement påvirkes?',['Personer','Struktur','Opgaver','Teknologi'],0,'Når medarbejdere uddannes eller udvikler kompetencer, påvirkes elementet Personer.'],['Virksomheden indfører et nyt lønsystem. Hvilket delelement påvirkes?',['Struktur','Teknologi','Personer','Kunder'],1,'Et lønsystem er et teknologisk værktøj.'],['Medarbejderne skal lære at bruge AI-værktøjer. Hvilket delelement påvirkes?',['Personer','Kunder','Lovgivning','Opgaver'],0,'Fokus er på medarbejdernes kompetencer.'],['Virksomheden ændrer organisationsdiagrammet. Hvilket delelement påvirkes?',['Struktur','Teknologi','Globalisering','Opgaver'],0,'Organisationsdiagrammet beskriver strukturen.'],['Lagerarbejdere får nye arbejdsopgaver. Hvilket delelement påvirkes?',['Teknologi','Opgaver','Personer','Kunder'],1,'Arbejdsopgaver hører til delelementet Opgaver.'],['Folketinget vedtager nye regler om databeskyttelse. Hvilket element påvirker virksomheden?',['Kunder','Teknologi','Lovgivning','Personer'],2,'Det er et lovgivningsmæssigt forhold.'],['Kunderne ønsker levering samme dag. Hvilket eksternt element påvirker virksomheden?',['Lovgivning','Kunder','Struktur','Globalisering'],1,'Ønsket kommer fra kunderne.'],['En kinesisk konkurrent går ind på markedet. Hvilket element er det?',['Globalisering','Teknologi','Opgaver','Struktur'],0,'International konkurrence er globalisering.']];while(data.length<25)data.push(...data.slice(0,Math.min(25-data.length,data.length)));data.length=25;data.sort(()=>Math.random()-0.5);let i=0,score=0;function render(){document.getElementById('count').textContent='Spørgsmål '+(i+1)+' af '+data.length;document.getElementById('bar').style.width=(i/data.length*100)+'%';document.getElementById('q').textContent=data[i][0];let h='';data[i][1].forEach((a,j)=>h+=`<label class="option"><input type="radio" name="a" value="${j}"> ${a}</label>`);answers.innerHTML=h;feedback.innerHTML='';explanation.innerHTML='';check.style.display='inline-block';next.style.display='none'}check.onclick=()=>{let s=document.querySelector('input[name=a]:checked');if(!s){alert('Vælg et svar');return;}let ok=Number(s.value)===data[i][2];if(ok){score++;feedback.innerHTML='✅ Korrekt';feedback.style.color='green';}else{feedback.innerHTML='❌ Forkert. Rigtigt svar: '+data[i][1][data[i][2]];feedback.style.color='red';}explanation.innerHTML='<p><strong>Forklaring:</strong> '+data[i][3]+'</p>';check.style.display='none';next.style.display='inline-block';};next.onclick=()=>{i++;if(i<data.length){render();}else{let level=score<15?'Begynder':score<22?'Øvet':'Ekspert';document.querySelector('.card').innerHTML=`<h2>Quiz afsluttet</h2><p>Score: <strong>${score}/${data.length}</strong></p><p>Niveau: <strong>${level}</strong></p><button onclick="location.reload()">Prøv igen</button>`;document.getElementById('bar').style.width='100%';}};render();</script></body></html>
