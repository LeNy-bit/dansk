<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quiz: Nyhedstrekanten og nyhedskriterier</title><style>body{font-family:Arial,sans-serif;max-width:900px;margin:40px auto;padding:20px;line-height:1.6}h1{color:#003366}#questionBox{background:#f5f5f5;padding:25px;border-radius:10px}#question{font-size:1.2em;font-weight:bold}input{width:300px;padding:10px;margin-right:10px}button{padding:10px 20px;margin-top:10px;cursor:pointer}.correct{color:green}.wrong{color:red}#progressContainer{width:100%;height:25px;background:#ddd;border-radius:20px;margin-bottom:20px;overflow:hidden}#progressBar{height:100%;width:0%;background:#2e8b57;transition:.4s}.stats{display:flex;gap:30px;margin-bottom:15px;font-weight:bold}</style></head><body><h1>Quiz: Nyhedstrekanten og nyhedskriterier</h1><div class="stats"><div id="score">Point: 0</div><div id="highscore">Highscore: 0</div></div><div id="progressContainer"><div id="progressBar"></div></div><p id="progress"></p><div id="questionBox"><p id="question"></p><input type="text" id="answer" autocomplete="off"><button onclick="checkAnswer()">Tjek svar</button><button onclick="nextQuestion()">Næste spørgsmål</button><p id="feedback"></p></div><script>let questions=[
{question:'Den journalistiske model, hvor det vigtigste kommer først, kaldes nyheds_____.',answers:['trekanten','trekant'],hint:'Begynder med t.',explanation:'Nyhedstrekanten prioriterer den vigtigste information først.'},
{question:'I nyhedstrekanten står den vigtigste information i _____.',answers:['toppen'],hint:'Øverste del.',explanation:'Læseren får det vigtigste med det samme.'},
{question:'Hvem, hvad, hvor og hvornår kaldes ofte nyhedens _____.',answers:['grundoplysninger'],hint:'Basis-informationer.',explanation:'De centrale fakta præsenteres først.'},
{question:'Et nyhedskriterium handler om, hvorfor en historie er _____.',answers:['nyhed'],hint:'Samme ord som genren.',explanation:'Kriterierne afgør nyhedsværdi.'},
{question:'Når noget lige er sket, opfylder det kriteriet _____.',answers:['aktualitet'],hint:'Noget aktuelt.',explanation:'Aktualitet er et centralt nyhedskriterium.'},
{question:'Når en historie berører mange mennesker, kaldes kriteriet _____.',answers:['væsentlighed'],hint:'Noget vigtigt.',explanation:'Væsentlighed handler om betydning.'},
{question:'Når en begivenhed foregår tæt på læseren, kaldes kriteriet _____.',answers:['identifikation'],hint:'Læsere kan genkende sig selv.',explanation:'Nærhed og genkendelse øger interessen.'},
{question:'Kendte personer øger ofte kriteriet _____.',answers:['sensation'],hint:'Opsigtsvækkende.',explanation:'Kendte personer gør ofte historier mere bemærkelsesværdige.'},
{question:'Konflikter og uenigheder opfylder kriteriet _____.',answers:['konflikt'],hint:'Parterne er uenige.',explanation:'Konflikt skaber interesse.'},
{question:'Det nyhedskriterium der handler om det usædvanlige hedder _____.',answers:['sensation'],hint:'Opsigtsvækkende.',explanation:'Sensation handler om det overraskende.'},
{question:'I nyhedstrekanten kommer detaljer typisk til sidst i _____.',answers:['artiklen'],hint:'Teksten.',explanation:'De mindst vigtige oplysninger placeres nederst.'},
{question:'En kort og præcis begyndelse kaldes en _____.',answers:['indledning'],hint:'Første del af artiklen.',explanation:'Indledningen præsenterer historiens kerne.'},
{question:'Nyheder bygger primært på _____.',answers:['fakta'],hint:'Ikke holdninger.',explanation:'Nyhedsartikler skal være faktabaserede.'},
{question:'En person med særlig viden kaldes en _____kilde.',answers:['ekspert'],hint:'Fagperson.',explanation:'Ekspertkilder bidrager med viden.'},
{question:'En person der selv har oplevet begivenheden er en _____kilde.',answers:['erfarings'],hint:'Har oplevet det selv.',explanation:'Erfaringskilder fortæller om egne oplevelser.'},
{question:'Journalister forsøger at besvare hvem, hvad, hvor, hvornår og _____.',answers:['hvordan'],hint:'Starter med h.',explanation:'De klassiske nyhedsspørgsmål.'},
{question:'Hvis en historie påvirker mange danskere, har den høj _____.',answers:['væsentlighed'],hint:'Betydning.',explanation:'Jo større betydning, desto større nyhedsværdi.'},
{question:'Hvis læseren kan spejle sig i historien, er der høj _____.',answers:['identifikation'],hint:'Genkendelse.',explanation:'Læsere engageres af genkendelige historier.'},
{question:'Nyhedstrekanten sikrer, at det vigtigste kommer _____.',answers:['først'],hint:'Ikke sidst.',explanation:'Det væsentligste placeres først.'},
{question:'En historie om en minister vil ofte have høj _____.',answers:['sensation'],hint:'Kendt person.',explanation:'Magtfulde og kendte personer øger nyhedsværdien.'}
];questions.sort(()=>Math.random()-0.5);questions=questions.slice(0,20);let currentQuestion=0,score=0,attempts=0,answered=false;let highscore=localStorage.getItem('nyhedHighscore')||0;document.getElementById('highscore').textContent='Highscore: '+highscore;function loadQuestion(){attempts=0;answered=false;answer.value='';feedback.innerHTML='';question.textContent=questions[currentQuestion].question;progress.textContent='Spørgsmål '+(currentQuestion+1)+' af '+questions.length;progressBar.style.width=((currentQuestion)/questions.length*100)+'%';}function checkAnswer(){if(answered)return;attempts++;let a=answer.value.trim().toLowerCase();let q=questions[currentQuestion];if(q.answers.includes(a)){answered=true;score++;scoreEl.textContent='Point: '+score;feedback.innerHTML='<span class="correct">✔ Korrekt! </span>'+q.explanation;}else if(attempts>=3){answered=true;feedback.innerHTML='<span class="wrong">✘ Korrekt svar: </span><b>'+q.answers[0]+'</b>. '+q.explanation;}else{feedback.innerHTML='<span class="wrong">Forkert.</span> Tip: '+q.hint+' Forsøg: '+attempts+'/3';}}function nextQuestion(){currentQuestion++;if(currentQuestion>=questions.length){let p=Math.round(score/questions.length*100);document.body.innerHTML='<h1>Quiz afsluttet</h1><h2>'+score+' af '+questions.length+'</h2><h2>'+p+'%</h2><button onclick="location.reload()">Prøv igen</button>';return;}loadQuestion();}answer.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});loadQuestion();</script></body></html>
