((currentQuestion)/questions.length)*100;

document.getElementById("progressBar").style.width =
percentage + "%";

**************************************************/

function checkAnswer(){

}

attempts++;

let answer =
document.getElementById("answer")
.value
.trim()
.toLowerCase();

let q = questions[currentQuestion];

let feedback =
document.getElementById("feedback");

if(q.answers.includes(answer)){

answered = true;
score++;

document.getElementById("score")
.textContent = "Point: " + score;

document.getElementById("answer")
.style.background = "#d4ffd4";

feedback.innerHTML =
"<span class='correct'>✔ Korrekt!</span>" +
q.explanation;

}

else{

document.getElementById("answer")
.style.background = "#ffd4d4";

if(attempts >= 3){

feedback.innerHTML =
"<span class='wrong'>✘ Korrekt svar:</span> <b>" +
q.answers[0] +
"</b>" +
q.explanation;

answered = true;

}
else{

feedback.innerHTML =
"<span class='wrong'>Forkert.</span>" +
"Tip: " + q.hint +
"Forsøg: " +
attempts +
"/3";

}

}

}
