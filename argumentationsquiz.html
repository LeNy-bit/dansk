<!DOCTYPE html><html lang="da"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Argumentationsquiz</title><style>body{font-family:Arial;max-width:900px;margin:40px auto;padding:20px;background:#f5f7fa}#quiz{background:#fff;padding:25px;border-radius:12px}.option{display:block;margin:8px 0}.hidden{display:none}</style></head><body><h1>Argumentation: Påstand, Belæg, Hjemmel, Ethos, Logos, Patos</h1><div id="quiz"></div><script>const questions=[{q:'I argumentet: Vi bør forbyde mobiltelefoner i undervisningen, fordi eleverne bliver lettere distraheret. Hvad er påstanden?',o:['Eleverne bliver lettere distraheret','Vi bør forbyde mobiltelefoner i undervisningen','Mobiltelefoner findes i undervisningen'],a:1},{q:'Hvad er belægget i samme argument?',o:['Påstanden','Eleverne bliver lettere distraheret','Skolen har regler'],a:1},{q:'Hvilken appelform bruges: Ifølge Sundhedsstyrelsen bør unge sove mindst 8 timer?',o:['Ethos','Patos','Logos'],a:0},{q:'Hvilken appelform bruges: Statistik viser bedre karakterer?',o:['Patos','Logos','Ethos'],a:1}];let i=0,s=0;function show(){if(i>=questions.length){document.getElementById('quiz').innerHTML='<h2>Færdig</h2><p>Score: '+s+'/'+questions.length+'</p>';return;}let q=questions[i];document.getElementById('quiz').innerHTML='<h3>Spørgsmål '+(i+1)+'</h3><p>'+q.q+'</p>'+q.o.map((x,n)=>'<label class="option"><input type="radio" name="a" value="'+n+'"> '+x+'</label>').join('')+'<button onclick="check()">Tjek svar</button><div id="fb"></div>';}function check(){let v=document.querySelector("input[name=a]:checked");if(!v)return; if(+v.value===questions[i].a){s++;document.getElementById('fb').innerHTML='Korrekt';} else document.getElementById('fb').innerHTML='Forkert'; i++; setTimeout(show,800);}show();</script></body></html>
