let currentQuestion=0,score=0,attempts=0,answered=false;
let highscore=localStorage.getItem('sproghandlingHighscore')||0;
document.getElementById('highscore').textContent='Highscore: '+highscore;
function loadQuestion(){attempts=0;answered=false;answer.value='';answer.style.background='white';feedback.innerHTML='';question.textContent=questions[currentQuestion].question;progress.textContent='Spørgsmål '+(currentQuestion+1)+' af '+questions.length;progressBar.style.width=((currentQuestion)/questions.length*100)+'%';}
function checkAnswer(){if(answered)return;attempts++;let a=answer.value.trim().toLowerCase();let q=questions[currentQuestion];if(q.answers.includes(a)){answered=true;score++;scoreEl=document.getElementById('score');scoreEl.textContent='Point: '+score;answer.style.background='#d4ffd4';feedback.innerHTML="<span class='correct'>✔ Korrekt!</span>"+q.explanation;}else{answer.style.background='#ffd4d4';if(attempts>=3){feedback.innerHTML="<span class='wrong'>✘ Korrekt svar:</span> <b>"+q.answers[0]+"</b>"+q.explanation;answered=true;}else{feedback.innerHTML="<span class='wrong'>Forkert.</span> Tip: "+q.hint+' Forsøg: '+attempts+'/3';}}}
function nextQuestion(){currentQuestion++;if(currentQuestion>=questions.length){showResult();return;}loadQuestion();}
function showResult(){let procent=Math.round(score/questions.length*100);let v=procent>=90?'Ekspert':procent>=75?'Meget sikker':procent>=50?'På vej':'Behøver mere træning';if(score>highscore){localStorage.setItem('sproghandlingHighscore',score);}document.body.innerHTML='<h1>Quiz afsluttet</h1><h2>Resultat: '+score+' ud af '+questions.length+'</h2><h2>'+procent+'%</h2><h2>Niveau: '+v+'</h2><button onclick="location.reload()">Prøv igen</button>';}
answer.addEventListener('keydown',e=>{if(e.key==='Enter')checkAnswer();});loadQuestion();
